name: unieee CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  infra-and-scripts:
    name: Infra, Scripts & Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify local-only files and secrets are not tracked
        run: |
          if git ls-files | grep -E '^(docs/|AGENTS\.md|\.env$|.*\.(crt|key|pem|p12))$'; then
            echo "ERROR: Local-only files or private keys/certs must NOT be committed."
            exit 1
          fi
          if git ls-files | grep -E '^\.env\.' | grep -v '^\.env\.example$'; then
            echo "ERROR: Environment secret file must NOT be committed."
            exit 1
          fi

      - name: Validate shell script syntax
        run: |
          bash -n scripts/unieee.sh scripts/lib/*.sh
          sh -n infra/pgbouncer/entrypoint.sh infra/redis/entrypoint-sentinel.sh infra/letsencrypt/entrypoint.sh infra/reverse-proxy/10-detect-resolver.envsh infra/reverse-proxy/20-enrollment-healthcheck.sh

      - name: Validate Keycloak realm & Nginx hardening configuration
        run: |
          python3 - <<'EOF'
          import json
          with open("infra/keycloak/realm-unieee.json", "r", encoding="utf-8") as f:
              realm = json.load(f)
          assert realm["realm"] == "unieee"
          assert realm["registrationAllowed"] is False, "Self-registration must remain disabled"
          assert 1800 <= int(realm["accessTokenLifespan"]) <= 3600, "Registration-season accessTokenLifespan must be 1800..3600s"
          role_names = {r["name"] for r in realm["roles"]["realm"]}
          assert {"STUDENT", "LECTURER", "ACADEMIC_ADMIN"}.issubset(role_names)
          flows = {fl["alias"]: fl for fl in realm.get("authenticationFlows", [])}
          assert "unieee-first-broker-login-link-only" in flows, "Missing link-only First Broker Login flow"
          auths = [ex["authenticator"] for ex in flows["unieee-first-broker-login-link-only"].get("authenticationExecutions", [])]
          assert "idp-detect-existing-broker-user" in auths and "idp-auto-link" in auths
          assert "idp-create-user-if-unique" not in auths, "Self-registration authenticator must NOT exist in link-only flow"

          with open("infra/reverse-proxy/nginx.conf", "r", encoding="utf-8") as f:
              nginx_conf = f.read()
          assert "proxy_cache_path" in nginx_conf and "catalog_cache" in nginx_conf
          assert "seats_cache" in nginx_conf
          with open("infra/reverse-proxy/snippets/unieee-routes.conf", "r", encoding="utf-8") as f:
              routes_conf = f.read()
          assert "proxy_cache_lock on;" in routes_conf
          assert "/tmp/enrollment-primary.conf" in routes_conf
          assert "$enrollment_read_upstream" in routes_conf
          assert "/api/v1/enrollments/seats" in routes_conf
          assert "/api/v1/enrollments/me" in routes_conf
          with open("infra/reverse-proxy/20-enrollment-healthcheck.sh", "r", encoding="utf-8") as f:
              hc_script = f.read()
          assert "enrollment_read_upstream" in hc_script
          with open("infra/compose.hotpath.yml", "r", encoding="utf-8") as f:
              hp_compose = f.read()
          assert "unieee.enrollment.outcomes" in hp_compose
          with open("infra/reverse-proxy/conf.d/default.conf.template", "r", encoding="utf-8") as f:
              proxy_tpl = f.read()
          assert "8089" in proxy_tpl and "stub_status" in proxy_tpl
          import glob
          dashboards = glob.glob("infra/monitoring/grafana/dashboards/*.json")
          assert len(dashboards) >= 2, "Expected production & k6 Grafana dashboards"
          for dash_path in dashboards:
              with open(dash_path, "r", encoding="utf-8") as df:
                  json.load(df)
          print("Keycloak realm, Nginx hardening & monitoring configuration validation OK")
          EOF

      - name: Validate Compose configurations
        run: |
          docker compose --env-file .env.example -f infra/compose.base.yml config --quiet
          docker compose --env-file .env.example -f infra/compose.base.yml -f infra/compose.hotpath.yml config --quiet
          docker compose --env-file .env.example -f infra/compose.base.yml -f infra/compose.monitoring.yml config --quiet
          docker compose --env-file .env.example -f infra/compose.base.yml -f infra/compose.hotpath.yml -f infra/compose.monitoring.yml --profile hot-path config --quiet
          docker compose --env-file .env.example -f infra/compose.base.yml -f infra/compose.letsencrypt.yml config --quiet
          docker compose --env-file .env.example -f infra/compose.base.yml -f infra/compose.cloudflared.yml --profile cf-quick config --quiet
          docker compose --env-file .env.example -f infra/compose.base.yml -f infra/compose.cloudflared.yml --profile cf-named config --quiet

      - name: Verify relative links in README files
        run: |
          python3 - <<'EOF'
          import os, re
          for fname in ("README.md", "README.vi.md"):
              with open(fname, "r", encoding="utf-8") as f:
                  text = f.read()
              for m in re.finditer(r"\]\((\./[^)]+)\)", text):
                  rel = m.group(1)
                  assert os.path.isfile(rel), f"{fname}: broken link {rel}"
                  assert not rel.startswith("./docs") and rel != "./AGENTS.md", f"{fname}: links to local-only {rel}"
              print(f"{fname}: links OK")
          EOF

  core-java:
    name: Spring Boot 4.1.3 Core & Modulith
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Spring Boot, Modulith & JaCoCo coverage checks
        working-directory: services/core-java
        run: ./gradlew check --no-daemon

      - name: Summarize JaCoCo coverage
        if: always()
        run: |
          python3 - <<'EOF'
          import os, xml.etree.ElementTree as ET
          report = "services/core-java/build/reports/jacoco/test/jacocoTestReport.xml"
          if not os.path.isfile(report):
              print("No JaCoCo XML report generated.")
              raise SystemExit(0)
          root = ET.parse(report).getroot()
          print("=== JaCoCo Line Coverage by Package ===")
          for pkg in root.findall("package"):
              name = pkg.attrib["name"].replace("/", ".")
              for c in pkg.findall("counter"):
                  if c.attrib["type"] == "LINE":
                      cov = int(c.attrib["covered"])
                      mis = int(c.attrib["missed"])
                      pct = (cov / (cov + mis) * 100.0) if (cov + mis) else 100.0
                      print(f"  {name}: {pct:.1f}% ({cov}/{cov + mis} lines)")
          EOF

      - name: Upload test & JaCoCo reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-java-test-and-coverage-report
          path: |
            services/core-java/build/reports/tests/test
            services/core-java/build/reports/jacoco/test

  rust-enrollment:
    name: Rust Hot Path Workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Cargo workspace
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/rust-enrollment

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check formatting and Clippy lints
        working-directory: services/rust-enrollment
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace unit, property, and concurrency tests
        working-directory: services/rust-enrollment
        run: cargo test --workspace

      - name: Enforce tiered Rust line coverage
        working-directory: services/rust-enrollment
        run: |
          cargo llvm-cov --workspace --json --output-path target/llvm-cov.json
          python3 ci/check_coverage.py target/llvm-cov.json
