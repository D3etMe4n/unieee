name: unieee

services:
  # Mode 1: Quick Tunnel (no custom domain required -> https://*.trycloudflare.com)
  cloudflared-quick:
    image: docker.io/cloudflare/cloudflared:2025.2.1
    container_name: unieee-cloudflared
    profiles: ["cf-quick"]
    restart: unless-stopped
    depends_on:
      reverse-proxy:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - --url
      - http://reverse-proxy:8088
    networks:
      - edge
      - app

  # Mode 2: Named Tunnel with custom domain configured in Cloudflare Zero Trust
  # Point the Public Hostname in Cloudflare Dashboard to: http://reverse-proxy:8088
  cloudflared-named:
    image: docker.io/cloudflare/cloudflared:2025.2.1
    container_name: unieee-cloudflared
    profiles: ["cf-named"]
    restart: unless-stopped
    depends_on:
      reverse-proxy:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command:
      - tunnel
      - --no-autoupdate
      - --metrics
      - 0.0.0.0:2000
      - run
    networks:
      - edge
      - app
