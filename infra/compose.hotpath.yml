name: unieee

volumes:
  kafka_data:
  enrollment_active_snapshots:
  enrollment_standby_snapshots:

services:
  kafka:
    image: docker.io/apache/kafka:3.9.0
    container_name: unieee-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-init:
    image: docker.io/apache/kafka:3.9.0
    container_name: unieee-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic unieee.enrollment.commands --partitions 12 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic unieee.enrollment.deltas --partitions 6 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic unieee.enrollment.dlq --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    networks:
      - app

  enrollment-engine-active:
    build:
      context: ../services/rust-enrollment
      dockerfile: Dockerfile
      args:
        BIN_NAME: enrollment-engine
    container_name: unieee-enrollment-engine-active
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      BIND_ADDR: 0.0.0.0:8081
      NODE_ROLE: ACTIVE
      REJOIN_AS_STANDBY_ON_RECOVERY: "true"
      TERM_CODE: ${TERM_CODE:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-unieee}:${POSTGRES_PASSWORD:-unieee_dev_password}@pgbouncer:6432/${POSTGRES_DB:-unieee}
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: unieee-enrollment-engine-active
      REDIS_SENTINEL_MASTER: unieee-master
      REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-unieee_redis_dev_password}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://keycloak:8080/auth/realms/unieee/protocol/openid-connect/certs}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      JWT_CACHE_TTL_SECS: ${JWT_CACHE_TTL_SECS:-30}
      JWKS_REFRESH_INTERVAL_SECS: ${JWKS_REFRESH_INTERVAL_SECS:-300}
      COALESCE_WINDOW_MS: ${COALESCE_WINDOW_MS:-50}
      SNAPSHOT_DIR: /var/lib/unieee/snapshots
      REPLAY_BATCH_SIZE: ${REPLAY_BATCH_SIZE:-5000}
      REPLAY_THROTTLE_MS: ${REPLAY_THROTTLE_MS:-30}
    volumes:
      - enrollment_active_snapshots:/var/lib/unieee/snapshots
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  enrollment-engine-standby:
    build:
      context: ../services/rust-enrollment
      dockerfile: Dockerfile
      args:
        BIN_NAME: enrollment-engine
    container_name: unieee-enrollment-engine-standby
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis-master:
        condition: service_healthy
      redis-sentinel-1:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      BIND_ADDR: 0.0.0.0:8081
      NODE_ROLE: STANDBY
      REJOIN_AS_STANDBY_ON_RECOVERY: "true"
      TERM_CODE: ${TERM_CODE:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-unieee}:${POSTGRES_PASSWORD:-unieee_dev_password}@pgbouncer:6432/${POSTGRES_DB:-unieee}
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: unieee-enrollment-engine-standby
      REDIS_SENTINEL_MASTER: unieee-master
      REDIS_SENTINEL_NODES: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-unieee_redis_dev_password}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://keycloak:8080/auth/realms/unieee/protocol/openid-connect/certs}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      JWT_CACHE_TTL_SECS: ${JWT_CACHE_TTL_SECS:-30}
      JWKS_REFRESH_INTERVAL_SECS: ${JWKS_REFRESH_INTERVAL_SECS:-300}
      COALESCE_WINDOW_MS: ${COALESCE_WINDOW_MS:-50}
      SNAPSHOT_DIR: /var/lib/unieee/snapshots
      REPLAY_BATCH_SIZE: ${REPLAY_BATCH_SIZE:-5000}
      REPLAY_THROTTLE_MS: ${REPLAY_THROTTLE_MS:-30}
    volumes:
      - enrollment_standby_snapshots:/var/lib/unieee/snapshots
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/readyz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Rust Writer and SSE Gateway services will be added in Phases 8-9.
