name: unieee

volumes:
  prometheus_data:
  grafana_data:

services:
  prometheus:
    image: docker.io/prom/prometheus:v3.2.1
    container_name: unieee-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${UNIEEE_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - edge
      - app
      - data
    healthcheck:
      test: ["CMD", "promtool", "check", "healthy", "--url=http://127.0.0.1:9090"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: docker.io/grafana/grafana:11.5.2
    container_name: unieee-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_dev_password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/unieee-production-overview.json
    ports:
      - "127.0.0.1:${UNIEEE_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - edge
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  nginx-exporter:
    image: docker.io/nginx/nginx-prometheus-exporter:1.4.1
    container_name: unieee-nginx-exporter
    restart: unless-stopped
    depends_on:
      reverse-proxy:
        condition: service_healthy
    command:
      - --nginx.scrape-uri=http://reverse-proxy:8089/stub_status
    networks:
      - app

  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: unieee-postgres-exporter
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB:-unieee}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-unieee}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:-unieee_dev_password}
    networks:
      - data

  pgbouncer-exporter:
    image: docker.io/prometheuscommunity/pgbouncer-exporter:v0.9.0
    container_name: unieee-pgbouncer-exporter
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
    command:
      - --pgBouncer.connectionString=postgres://${POSTGRES_USER:-unieee}:${POSTGRES_PASSWORD:-unieee_dev_password}@pgbouncer:6432/pgbouncer?sslmode=disable
    networks:
      - data

  redis-exporter:
    image: docker.io/oliver006/redis_exporter:v1.67.0
    container_name: unieee-redis-exporter
    restart: unless-stopped
    depends_on:
      redis-master:
        condition: service_healthy
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-unieee_redis_dev_password}
    networks:
      - data

  kafka-exporter:
    image: docker.io/danielqsj/kafka-exporter:v1.8.0
    container_name: unieee-kafka-exporter
    profiles: ["hot-path"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - --kafka.server=kafka:9092
      - --topic.filter=^unieee\..*
      - --group.filter=^unieee-.*
    networks:
      - app
