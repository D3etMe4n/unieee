apiVersion: 1

providers:
  - name: unieee-dashboards
    orgId: 1
    folder: unieee
    folderUid: unieee-folder
    type: file
    disableDeletion: false
    updateIntervalSeconds: 15
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
