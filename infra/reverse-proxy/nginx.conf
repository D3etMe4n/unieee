user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # Rate limit zones
    limit_req_zone $binary_remote_addr zone=enroll_limit:10m rate=25r/s;
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=15r/s;
    limit_req_status 429;

    # Public catalog cache (anti-cache-stampede via proxy_cache_lock)
    proxy_cache_path /var/cache/nginx/catalog levels=1:2 keys_zone=catalog_cache:10m max_size=100m inactive=5m use_temp_path=off;

    # Hot-path live seats 1s micro-cache (anti-thundering-herd during degraded mode)
    proxy_cache_path /var/cache/nginx/seats levels=1:2 keys_zone=seats_cache:10m max_size=50m inactive=1m use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
