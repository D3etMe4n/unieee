location = /proxy-health {
    access_log off;
    default_type text/plain;
    return 200 "OK\n";
}

# Keycloak Public OIDC Endpoints Only (realm 'unieee' allowlist; /auth/admin & master realm are blocked on edge)
location = /auth/realms/unieee/.well-known/openid-configuration {
    limit_req zone=api_limit burst=60 nodelay;
    set $keycloak_upstream http://keycloak:8080;
    proxy_pass $keycloak_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $edge_forwarded_port;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
}

location ^~ /auth/realms/unieee/protocol/openid-connect/ {
    limit_req zone=auth_limit burst=30 nodelay;
    set $keycloak_upstream http://keycloak:8080;
    proxy_pass $keycloak_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $edge_forwarded_port;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
}

location ^~ /auth/realms/unieee/login-actions/ {
    limit_req zone=auth_limit burst=20 nodelay;
    set $keycloak_upstream http://keycloak:8080;
    proxy_pass $keycloak_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $edge_forwarded_port;
