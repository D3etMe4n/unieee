# Block Keycloak Admin Console, Admin REST API (/auth/admin/**), master realm,
# account console, dynamic client registration, and health/metrics endpoints on the edge proxy.
location /auth/ {
    return 404;
}

# Hot Path Read Split: Live Section Seats (routed to STANDBY when healthy, 1s micro-cache + stampede lock)
location = /api/v1/enrollments/seats {
    limit_req zone=api_limit burst=120 nodelay;
    include /tmp/enrollment-primary.conf;
    set $seats_cache_bypass 0;
    if ($http_authorization = "") {
        set $seats_cache_bypass 1;
    }
    proxy_pass $enrollment_read_upstream;
    proxy_cache seats_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 1s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 2s;
    proxy_cache_lock_age 2s;
    proxy_cache_bypass $seats_cache_bypass;
    proxy_no_cache $seats_cache_bypass;
    proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @enrollment_read_fallback;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
}

# Hot Path Read Split: Personal Student Enrollments in RAM (routed to STANDBY when healthy, never cached)
location = /api/v1/enrollments/me {
    limit_req zone=api_limit burst=60 nodelay;
    include /tmp/enrollment-primary.conf;
    proxy_pass $enrollment_read_upstream;
    proxy_cache off;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @enrollment_read_fallback;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
}

location @enrollment_read_fallback {
    include /tmp/enrollment-primary.conf;
    proxy_pass $enrollment_primary;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
}

# Hot Path: Rust Enrollment Engine (Active with Standby warm failover via /readyz monitor)
location /api/v1/enrollments/ {
    limit_req zone=enroll_limit burst=30 nodelay;
    include /tmp/enrollment-primary.conf;
    proxy_pass $enrollment_primary;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @enrollment_standby;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
}

location @enrollment_standby {
    include /tmp/enrollment-primary.conf;
    proxy_pass $enrollment_secondary;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
}

# Hot Path: Rust SSE Live-Update Service (Buffering MUST be disabled)
location /api/v1/sse/ {
    set $sse_upstream http://sse-gateway:8083;
    proxy_pass $sse_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    chunked_transfer_encoding on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_hide_header X-Accel-Buffering;
    add_header X-Accel-Buffering no always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
}

# AI Advisor (Strict rate limit to protect LLM quota)
location /api/v1/ai/ {
    limit_req zone=ai_limit burst=10 nodelay;
    set $core_java_upstream http://core-java:8080;
    proxy_pass $core_java_upstream;
    proxy_read_timeout 30s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
}

# Public Read-Only Catalog (Anti-Cache-Stampede via proxy_cache_lock)
location ^~ /api/v1/public/ {
    limit_req zone=api_limit burst=100 nodelay;
    set $core_java_upstream http://core-java:8080;
    proxy_pass $core_java_upstream;
    proxy_cache catalog_cache;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    proxy_cache_valid 200 5s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 5s;
    proxy_cache_lock_age 5s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    add_header X-Cache-Status $upstream_cache_status always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_read_timeout 15s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
}

# Warm / Cold Path: Spring Boot 4.1.3 Modular Monolith
location /api/v1/ {
    limit_req zone=api_limit burst=60 nodelay;
    set $core_java_upstream http://core-java:8080;
    proxy_pass $core_java_upstream;
    proxy_read_timeout 30s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
}

# Explicit deny-by-default catch-all (never expose /, /actuator/**, /metrics, /stub_status, /healthz, /readyz, /internal/**)
location / {
    return 404;
}
