location = /proxy-health {
    access_log off;
    default_type text/plain;
    return 200 "OK\n";
}

# Keycloak (OIDC 1.0 / OAuth 2.0 / JWT)
location /auth/ {
    set $keycloak_upstream http://keycloak:8080;
    proxy_pass $keycloak_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $edge_forwarded_port;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
}

# Hot Path: Rust Enrollment Engine (Active with Standby warm failover)
location /api/v1/enrollments/ {
    limit_req zone=enroll_limit burst=30 nodelay;
    set $enrollment_active http://enrollment-engine-active:8081;
    proxy_pass $enrollment_active;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_intercept_errors on;
    error_page 502 504 = @enrollment_standby;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
}

location @enrollment_standby {
    set $enrollment_standby http://enrollment-engine-standby:8081;
    proxy_pass $enrollment_standby;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
}

# Hot Path: Rust SSE Live-Update Service (Buffering MUST be disabled)
location /api/v1/sse/ {
    set $sse_upstream http://sse-gateway:8082;
    proxy_pass $sse_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    add_header X-Accel-Buffering no;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
}

# AI Advisor (Strict rate limit to protect LLM quota)
location /api/v1/ai/ {
    limit_req zone=ai_limit burst=10 nodelay;
    set $core_java_upstream http://core-java:8080;
    proxy_pass $core_java_upstream;
    proxy_read_timeout 30s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
}

# Warm / Cold Path: Spring Boot 4.1.2 Modular Monolith
location /api/v1/ {
    limit_req zone=api_limit burst=60 nodelay;
    set $core_java_upstream http://core-java:8080;
    proxy_pass $core_java_upstream;
    proxy_read_timeout 30s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $edge_forwarded_proto;
}
