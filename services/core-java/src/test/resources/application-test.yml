spring:
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:19999/auth/realms/unieee/protocol/openid-connect/certs
  data:
    redis:
      repositories:
        enabled: false

  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none

management:
  health:
    redis:
      enabled: false

unieee:
  outbox:
    cleanup:
      enabled: true
      retention: 24h
  keycloak:
    admin:
      enabled: false
  policy:
    cache:
      redis:
        enabled: false
  ai-advisor:
    redis-seat-cache:
      enabled: false
