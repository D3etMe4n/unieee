spring:
  jpa:
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:19999/auth/realms/unieee/protocol/openid-connect/certs
  data:
    redis:
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false

unieee:
  outbox:
    cleanup:
      enabled: true
      retention: 24h
