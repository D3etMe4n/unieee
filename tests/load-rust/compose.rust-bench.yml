name: unieee-rust-bench

networks:
  bench_net:
    driver: bridge

volumes:
  bench_pg_data:
  bench_kafka_data:
  bench_snapshots:

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    container_name: unieee-rust-bench-postgres
    restart: "no"
    environment:
      POSTGRES_DB: unieee
      POSTGRES_USER: unieee
      POSTGRES_PASSWORD: unieee_bench_password
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - synchronous_commit=on
    volumes:
      - bench_pg_data:/var/lib/postgresql/data
      - ../../services/core-java/src/main/resources/db/migration/V002__init_catalog_schema.sql:/docker-entrypoint-initdb.d/02-catalog.sql:ro
      - ../../services/core-java/src/main/resources/db/migration/V003__init_account_schema.sql:/docker-entrypoint-initdb.d/03-account.sql:ro
      - ../../services/core-java/src/main/resources/db/migration/V004__init_registration_schema.sql:/docker-entrypoint-initdb.d/04-registration.sql:ro
      - ../../services/core-java/src/main/resources/db/migration/V005__init_registration_survey_policy_window.sql:/docker-entrypoint-initdb.d/05-registration-policy.sql:ro
    networks:
      - bench_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unieee -d unieee"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  pgbouncer:
    image: docker.io/edoburu/pgbouncer:v1.23.1-p0
    container_name: unieee-rust-bench-pgbouncer
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: unieee
      POSTGRES_PASSWORD: unieee_bench_password
    volumes:
      - ../../infra/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ../../infra/pgbouncer/entrypoint.sh:/etc/pgbouncer/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/etc/pgbouncer/entrypoint.sh"]
    networks:
      - bench_net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 3s

  redis:
    image: docker.io/library/redis:7.4-alpine
    container_name: unieee-rust-bench-redis
    restart: "no"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxclients", "10000"]
    networks:
      - bench_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 3s

  kafka:
    image: docker.io/apache/kafka:3.9.0
    container_name: unieee-rust-bench-kafka
    restart: "no"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - bench_kafka_data:/var/lib/kafka/data
    networks:
      - bench_net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  kafka-init:
    image: docker.io/apache/kafka:3.9.0
    container_name: unieee-rust-bench-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic unieee.enrollment.commands --partitions 12 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic unieee.enrollment.outcomes --partitions 12 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic unieee.enrollment.deltas --partitions 6 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic unieee.enrollment.dlq --partitions 3 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    networks:
      - bench_net

  jwks-server:
    image: docker.io/library/nginx:1.27-alpine
    container_name: unieee-rust-bench-jwks
    restart: "no"
    volumes:
      - ./jwks-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.work/jwks.json:/usr/share/nginx/html/jwks.json:ro
    networks:
      - bench_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/jwks.json >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  enrollment-engine:
    build:
      context: ../../services/rust-enrollment
      dockerfile: Dockerfile
      args:
        BIN_NAME: enrollment-engine
    container_name: unieee-rust-bench-engine
    restart: "no"
    ports:
      - "127.0.0.1:${BENCH_ENGINE_HOST_PORT:-18081}:8081"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      jwks-server:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      BIND_ADDR: 0.0.0.0:8081
      NODE_ROLE: ACTIVE
      REJOIN_AS_STANDBY_ON_RECOVERY: "false"
      INTERNAL_OPS_TOKEN: ${BENCH_INTERNAL_OPS_TOKEN:-bench-internal-ops-token}
      DATABASE_URL: postgresql://unieee:unieee_bench_password@pgbouncer:6432/unieee
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: unieee-rust-bench-engine
      REDIS_URL: redis://redis:6379
      OIDC_JWKS_URI: http://jwks-server:8080/jwks.json
      OIDC_ISSUER: http://jwks-server:8080
      JWT_CACHE_TTL_SECS: ${BENCH_JWT_CACHE_TTL_SECS:-300}
      JWKS_REFRESH_INTERVAL_SECS: 300
      COALESCE_WINDOW_MS: ${BENCH_COALESCE_WINDOW_MS:-50}
      SNAPSHOT_DIR: /var/lib/unieee/snapshots
      REPLAY_BATCH_SIZE: 5000
      REPLAY_THROTTLE_MS: 30
      RATE_LIMIT_ENABLED: ${BENCH_RATE_LIMIT_ENABLED:-false}
      RUST_LOG: ${BENCH_RUST_LOG:-warn,enrollment_engine=info}
    volumes:
      - bench_snapshots:/var/lib/unieee/snapshots
    networks:
      - bench_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/readyz >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  enrollment-writer:
    build:
      context: ../../services/rust-enrollment
      dockerfile: Dockerfile
      args:
        BIN_NAME: enrollment-writer
    container_name: unieee-rust-bench-writer
    restart: "no"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      BIND_ADDR: 0.0.0.0:8082
      DATABASE_URL: postgresql://unieee:unieee_bench_password@pgbouncer:6432/unieee
      PG_MAX_CONNECTIONS: ${BENCH_WRITER_PG_CONNS:-16}
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: unieee-rust-bench-writer
      REDIS_URL: redis://redis:6379
      BATCH_SIZE: ${BENCH_WRITER_BATCH_SIZE:-250}
      BATCH_TIMEOUT_MS: ${BENCH_WRITER_BATCH_TIMEOUT_MS:-30}
      CACHE_TTL_SECS: 900
      RUST_LOG: ${BENCH_RUST_LOG:-warn,enrollment_writer=info}
    networks:
      - bench_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8082/readyz >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  sse-gateway:
    build:
      context: ../../services/rust-enrollment
      dockerfile: Dockerfile
      args:
        BIN_NAME: sse-gateway
    container_name: unieee-rust-bench-sse
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
      jwks-server:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      BIND_ADDR: 0.0.0.0:8083
      REDIS_URL: redis://redis:6379
      OIDC_JWKS_URI: http://jwks-server:8080/jwks.json
      OIDC_ISSUER: http://jwks-server:8080
      JWT_CACHE_TTL_SECS: ${BENCH_JWT_CACHE_TTL_SECS:-300}
      JWKS_REFRESH_INTERVAL_SECS: 300
      SSE_COALESCE_WINDOW_MS: ${BENCH_SSE_COALESCE_MS:-150}
      SSE_HEARTBEAT_INTERVAL_SECS: 15
      SSE_TERM_CHANNEL_CAPACITY: ${BENCH_SSE_TERM_CHANNEL_CAP:-2048}
      SSE_MAX_CONNECTIONS: ${BENCH_SSE_MAX_CONNECTIONS:-50000}
      RATE_LIMIT_ENABLED: ${BENCH_RATE_LIMIT_ENABLED:-false}
      RUST_LOG: ${BENCH_RUST_LOG:-warn,sse_gateway=info}
    networks:
      - bench_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8083/readyz >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
