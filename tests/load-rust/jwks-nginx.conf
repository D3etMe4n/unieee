server {
    listen 8080;
    server_name _;

    access_log off;

    location = /jwks.json {
        alias /usr/share/nginx/html/jwks.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        default_type text/plain;
        return 200 "OK\n";
    }

    location / {
        return 404;
    }
}
